apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      secretKeyRef:
        name: REDIS_HOST
        key: REDIS_HOST
    - name: actorStateStore
      value: "true"

auth:
  secretStore: envvar-secret-store
